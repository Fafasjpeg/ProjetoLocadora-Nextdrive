<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pagamento.css') }}">
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='img/imglogo.png') }}" class="logo" alt="Logo">
    <h1>NextDrive</h1>
  </header>

  <main>
    <h2>Informações de Pagamento</h2>
    <form id="formPagamento">
      <label for="numero-cartao">Número do cartão</label>
      <input type="text" id="numero-cartao" name="numero-cartao" maxlength="19" placeholder="0000 0000 0000 0000" required>

      <label for="nome-cartao">Nome no cartão</label>
      <input type="text" id="nome-cartao" name="nome-cartao" placeholder="Como aparece no cartão" required>

      <div class="linha-dupla">
        <div>
          <label for="validade">Validade (MM/AA)</label>
          <input type="text" id="validade" name="validade" maxlength="5" placeholder="MM/AA" required>
        </div>

        <div>
          <label for="cvv">CVV</label>
          <input type="text" id="cvv" name="cvv" maxlength="3" placeholder="***" required style="width: 80%;">
        </div>
      </div>

      <button type="submit">Pagar</button>
    </form>
  </main>

  <script>
    // Máscara simples para o número do cartão e validade
    document.getElementById("numero-cartao").addEventListener("input", function (e) {
      e.target.value = e.target.value
        .replace(/\D/g, "")
        .replace(/(\d{4})(?=\d)/g, "$1 ")
        .trim();
    });

    document.getElementById("validade").addEventListener("input", function (e) {
      e.target.value = e.target.value
        .replace(/\D/g, "")
        .replace(/(\d{2})(\d{1,2})/, "$1/$2")
        .substr(0, 5);
    });
  </script>
</body>
</html>
