<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva Confirmada</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/confirmacaoreserva.css') }}">
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='img/imglogo.png') }}" alt="Logo" class="logo">
    <h1>NextDrive</h1>
  </header>

  <main class="confirmation-container">
    <div class="confirmation-card">
      <h2 class="confirmation-title">Reserva Confirmada ✓</h2>
      <p class="confirmation-code">Código da reserva: <strong>ND-123456</strong></p>
      <p class="confirmation-message">Um e-mail foi enviado com os detalhes da sua reserva.</p>
      
      <div class="confirmation-buttons">
        <a href="/perfil" class="btn btn-primary">Minhas Reservas</a>
        <a href="/home" class="btn btn-secondary">Voltar ao Início</a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 NextDrive</p>
  </footer>
</body>
</html>
