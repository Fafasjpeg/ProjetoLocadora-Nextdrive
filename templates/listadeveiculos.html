<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Veículos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/listadeveiculos.css') }}">
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='img/imglogo.png') }}" class="logo" alt="Logo">
    <h1>Lista de Veículos</h1>
  </header>

  <main>
    <div class="grid">
      <div class="carro">
        <img src="{{ url_for('static', filename='img/cars/car1.jpg') }}" alt="Hatch compacto">
        <h3>Hatch Compacto</h3>
        <p>R$ 99/dia</p>
        <a href="/reserva" class="btn">Reservar</a>
      </div>

      <div class="carro">
        <img src="{{ url_for('static', filename='img/cars/car2.jpg') }}" alt="Sedan Confort">
        <h3>Sedan Confort</h3>
        <p>R$ 139/dia</p>
        <a href="/reserva" class="btn">Reservar</a>
      </div>

      <div class="carro">
        <img src="{{ url_for('static', filename='img/cars/car3.jpg') }}" alt="SUV Espaçoso">
        <h3>SUV Espaçoso</h3>
        <p>R$ 199/dia</p>
        <a href="/reserva" class="btn">Reservar</a>
      </div>

      <div class="carro">
        <img src="{{ url_for('static', filename='img/cars/car4.jpg') }}" alt="Executivo Premium">
        <h3>Executivo Premium</h3>
        <p>R$ 269/dia</p>
        <a href="/reserva" class="btn">Reservar</a>
      </div>
    </div>
  </main>
</body>
</html>
