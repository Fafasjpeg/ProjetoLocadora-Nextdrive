<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Veículos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/listadeveiculos.css') }}">
</head>
<body>
  <header>
    <img src="img/imglogo.png" class="logo" alt="Logo">
    <h1>Veículos</h1>
  </header>

  <main>
    <div class="grid">
      <div class="carro">
        <img src="img/cars/car1.jpg" alt="Hatch">
        <h3>Hatch Compacto</h3>
        <p>R$ 99/dia</p>
        <a href="/veiculo">Detalhes</a>
      </div>
      <div class="carro">
        <img src="img/cars/car2.jpg" alt="Sedan">
        <h3>Sedan Confort</h3>
        <p>R$ 139/dia</p>
        <a href="/veiculo">Detalhes</a>
      </div>
    </div>
  </main>
</body>
</html>
