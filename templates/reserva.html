<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reserva.css') }}">
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='img/imglogo.png') }}" alt="Logo" class="logo">
    <h1>NextDrive</h1>
  </header>

  <main>
    <h2>Reserva do Veículo</h2>

    <section class="carro">
      <img src="{{ url_for('static', filename='img/cars/car1.jpg') }}" alt="Carro escolhido">
      <h3>Sedan Confortável</h3>
      <p>R$ 99/dia</p>
    </section>

    <form>
      <label for="dataretirada">Data de Retirada</label>
      <input type="date" id="dataretirada" name="dataretirada" required>

      <label for="agenciaretirada">Agência de Retirada</label>
      <select name="agenciaretirada" id="agenciaretirada" required>
        <option value="">Selecione</option>
        <!-- colocar as agencias registradas no banoc usando o jinja dps -->
        <option value="aeroporto">Aeroporto</option>
        <option value="centro">Centro da Cidade</option>
        <option value="estacao">Estação de Trem</option>
      </select>

      <label for="datadevolucao">Data de Devolução</label>
      <input type="date" id="datadevolucao" name="datadevolucao" required>

      <label for="agenciadevolucao">Agência de Retirada</label>
      <select name="agenciadevolucao" id="agenciadevolucao" required>
        <option value="">Selecione</option>
        <!-- colocar as agencias registradas no banoc usando o jinja dps -->
        <option value="aeroporto">Aeroporto</option>
        <option value="centro">Centro da Cidade</option>
        <option value="estacao">Estação de Trem</option>
      </select>

      <button type="submit">Confirmar Reserva</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 NextDrive</p>
  </footer>
</body>
</html>
