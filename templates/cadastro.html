<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Cliente - NextDrive</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('home') }}">
      <img src="{{ url_for('static', filename='img/imglogo.png') }}" alt="Logo" class="logo">
    </a>
    <h1>NextDrive</h1>
  </header>

  <main>
    
    <p>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% if mensagens %}
        {% for categoria, msg in mensagens %}
          <div class="flash {{ categoria }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    </p>

    <h2>Cadastro do Cliente</h2>
    <form action="/cadastro" method="POST" enctype="multipart/form-data" onsubmit="return validarMaiorDe18()">

      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" maxlength="200" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" maxlength="200" required>

      <label for="senha">Senha</label>

      <!-- icone pra descobrir a senha -->
      <div class="password-wrapper">
        <input type="password" id="senha" name="senha" required aria-describedby="toggle-senha">
        <button type="button" class="toggle-password" id="toggle-senha" aria-pressed="false" aria-label="Mostrar senha">
          <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <label for="dataNascimento">Data de Nascimento</label>
      <input type="date" id="data_nascimento" name="data_nascimento" required>

      <label for="cnh">Número da CNH</label>
      <input type="text" id="cnh" name="cnh" maxlength="11" required>

      <label for="genero">Gênero</label>
      <select id="genero" name="genero" required>
        <option value="">Selecione</option>
        <option value="M">Masculino</option>
        <option value="F">Feminino</option>
        <option value="O">Outro</option>
      </select>

      <label for="foto">Foto de Perfil</label>
      <input type="file" id="foto" name="foto" accept="image/*">

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" maxlength="15" required>

      <label for="telefone">Telefone</label>
      <input type="text" id="telefone" name="telefone" maxlength="15" required>

      <h2>Endereço do Cliente</h2>

      <label for="logradouro">Logradouro (Nome da Rua, Avenida, etc)</label>
      <input type="text" id="logradouro" name="logradouro" maxlength="250" required>

      <label for="numero">Número</label>
      <input type="number" id="numero" name="numero" maxlength="6" required>

      <label for="bairro">Bairro</label>
      <input type="text" id="bairro" name="bairro" maxlength="100" required>

      <label for="cep">CEP</label>
      <input type="text" id="cep" name="cep" maxlength="9" required>

      <label for="complemento">Complemento</label>
      <input type="text" id="complemento" name="complemento" maxlength="200">

      <label for="cidade">Cidade</label>
      <input type="text" id="cidade" name="cidade" maxlength="100" required>

      <label for="estado">Estado</label>
      <select id="estado" name="estado" required>
        <option value="">Selecione</option>
        <option value="AC">Acre</option>
        <option value="AL">Alagoas</option>
        <option value="AP">Amapá</option>
        <option value="AM">Amazonas</option>
        <option value="BA">Bahia</option>
        <option value="CE">Ceará</option>
        <option value="DF">Distrito Federal</option>
        <option value="ES">Espírito Santo</option>
        <option value="GO">Goiás</option>
        <option value="MA">Maranhão</option>
        <option value="MT">Mato Grosso</option>
        <option value="MS">Mato Grosso do Sul</option>
        <option value="MG">Minas Gerais</option>
        <option value="PA">Pará</option>
        <option value="PB">Paraíba</option>
        <option value="PR">Paraná</option>
        <option value="PE">Pernambuco</option>
        <option value="PI">Piauí</option>
        <option value="RJ">Rio de Janeiro</option>
        <option value="RN">Rio Grande do Norte</option>
        <option value="RS">Rio Grande do Sul</option>
        <option value="RO">Rondônia</option>
        <option value="RR">Roraima</option>
        <option value="SC">Santa Catarina</option>
        <option value="SP">São Paulo</option>
        <option value="SE">Sergipe</option>
        <option value="TO">Tocantins</option>
      </select>

      <button type="submit">Finalizar Cadastro</button>
    </form>
  </main>
  
  <script>
document.addEventListener("DOMContentLoaded", function () {

  /*mascara cpf*/
  const cpfInput = document.getElementById("cpf");

  cpfInput.addEventListener("input", function () {
    let v = cpfInput.value.replace(/\D/g, "");

    if (v.length > 11) v = v.slice(0, 11);

    // 000.000.000-00
    if (v.length >= 9) {
      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/,
                    "$1.$2.$3-$4");
    }
    else if (v.length >= 6) {
      v = v.replace(/(\d{3})(\d{3})(\d{0,3})/,
                    "$1.$2.$3");
    }
    else if (v.length >= 3) {
      v = v.replace(/(\d{3})(\d{0,3})/,
                    "$1.$2");
    }

    cpfInput.value = v;
  });


  /*mascara telefone*/
  const telInput = document.getElementById("telefone");

  telInput.addEventListener("input", function () {
    let v = telInput.value.replace(/\D/g, "");

    if (v.length > 11) v = v.slice(0, 11);

    // (XX) XXXXX-XXXX
    if (v.length > 6) {
      v = v.replace(/(\d{2})(\d{5})(\d{0,4})/,
                    "($1) $2-$3");
    }
    else if (v.length > 2) {
      v = v.replace(/(\d{2})(\d{0,5})/,
                    "($1) $2");
    }
    else if (v.length > 0) {
      v = v.replace(/(\d{0,2})/, "($1");
    }

    telInput.value = v;
  });


/* mascara cep */
const cepInput = document.getElementById("cep");

cepInput.addEventListener("input", function () {
    let v = cepInput.value.replace(/\D/g, ""); // remove tudo que nao for numero

    if (v.length > 8) v = v.slice(0, 8); // garante maximo 8 numeros

    if (v.length > 5) {
        v = v.replace(/(\d{5})(\d{0,3})/, "$1-$2"); // 00000-000
    }

    cepInput.value = v;
});



  function validarMaiorDe18() {
    const dataNasc = document.getElementById("data_nascimento").value;
    if (!dataNasc) return false;

    const hoje = new Date();
    const nascimento = new Date(dataNasc);

    let idade = hoje.getFullYear() - nascimento.getFullYear();
    const mes = hoje.getMonth() - nascimento.getMonth();

    if (mes < 0 || (mes === 0 && hoje.getDate() < nascimento.getDate())) {
        idade--;
    }

    if (idade < 18) {
        alert("Você deve ter pelo menos 18 anos para se cadastrar.");
        return false;
    }

    return true;
}

  /*esconder e mostrar a senha*/
  const senhaInput = document.getElementById("senha");
  const toggleBtn = document.getElementById("toggle-senha");
  const icon = document.getElementById("icon-eye");

  const iconClosed = `
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" 
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>`;

  const iconOpen = `
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8
               a20.11 20.11 0 0 1 5.06-6.06"></path>
      <path d="M1 1l22 22"></path>
    </svg>`;

  toggleBtn.addEventListener("click", function () {
    const hidden = senhaInput.type === "password";

    senhaInput.type = hidden ? "text" : "password";
    toggleBtn.innerHTML = hidden ? iconOpen : iconClosed;
  });


  /*validacao email*/
  document.querySelector("form").addEventListener("submit", function (event) {
    const emailInput = document.getElementById("email");
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailRegex.test(emailInput.value.trim())) {
      alert("Digite um e-mail válido!");
      event.preventDefault();
    }
  });

});
</script>

</body>
</html>
