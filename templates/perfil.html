<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - NextDrive</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='img/imglogo.png') }}" alt="Logo" class="logo">
    <h1>NextDrive</h1>
  </header>

  <main>
    <section class="perfil-card">
      <!-- 🔥 Foto de perfil circular -->
      <div class="foto-perfil">
        <img src="{{ url_for('static', filename='img/default-user.jpg') }}" alt="Foto de perfil">
      </div>

      <h2>Meu Perfil</h2>
      <div class="info">
        <p><strong>Nome:</strong> Usuário Teste</p>
        <p><strong>Email:</strong> teste@email.com</p>
      </div>
      <a href="/home" class="btn-voltar">Voltar</a>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 NextDrive</p>
  </footer>
</body>
</html>
