<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Empregado - NextDrive</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='img/imglogo.png') }}" alt="Logo" class="logo">
    <h1>NextDrive</h1>
  </header>

  <main>

    <p>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% if mensagens %}
        {% for categoria, msg in mensagens %}
          <div class="flash {{ categoria }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    </p>

    <h2>Cadastro do Empregado (admin)</h2>
    <form id="formCadastro" action="/cadastroAdm" method="POST">

      <!-- NOME -->
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" maxlength="255" required>

      <!-- EMAIL -->
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" maxlength="255" required>
      <p id="erroEmail" style="color:red; display:none;">E-mail inválido!</p>

      <!-- SENHA -->
      <label for="senha">Senha</label>
      <div class="password-wrapper">
        <input type="password" id="senha" name="senha" required aria-describedby="toggle-senha">
        <button type="button" class="toggle-password" id="toggle-senha" aria-pressed="false" aria-label="Mostrar senha">
          <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <!-- CPF -->
      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" maxlength="11" required>

      <!-- DATA NASCIMENTO -->
      <label for="data_de_nasci">Data de Nascimento</label>
      <input type="date" id="data_de_nasci" name="data_de_nasci" required>

      <!-- GENERO -->
      <label for="genero">Gênero</label>
      <select id="genero" name="genero" required>
        <option value="">Selecione</option>
        <option value="M">Masculino</option>
        <option value="F">Feminino</option>
        <option value="O">Outro</option>
      </select>

      <!-- TELEFONE -->
      <label for="telefone">Telefone</label>
      <input type="text" id="telefone" name="telefone" maxlength="15" required>

      <!-- SALARIO -->
      <label for="salario">Salário</label>
      <input type="number" step="0.01" id="salario" name="salario" required>

      

      <h2>Endereço do Empregado</h2>

      <label for="logradouro">Logradouro</label>
      <input type="text" id="logradouro" name="logradouro" maxlength="255" required>

      <label for="numero">Número</label>
      <input type="number" id="numero" name="numero" required>

      <label for="bairro">Bairro</label>
      <input type="text" id="bairro" name="bairro" maxlength="255" required>

      <label for="cep">CEP</label>
      <input type="text" id="cep" name="cep" maxlength="8" required>

      <label for="complemento">Complemento</label>
      <input type="text" id="complemento" name="complemento" maxlength="100">

      <label for="cidade">Cidade</label>
      <input type="text" id="cidade" name="cidade" maxlength="100" required>

      <label for="estado">Estado</label>
      <input type="text" id="estado" name="estado" maxlength="100" required>

      <!-- DEPARTAMENTO -->
      <label for="id_departamento">Departamento</label>
      <select name="id_departamento" id="id_departamento" required>
        <option value="">Selecione</option>
        {% for d in departamentos %}
          <option value="{{ d.id_departamento }}">{{ d.nome }}</option>
        {% endfor %}
      </select>

      <!-- CARGO -->
      <label for="id_cargo">Cargo</label>
      <select name="id_cargo" id="id_cargo" required>
        <option value="">Selecione</option>
        {% for c in cargos %}
          <option value="{{ c.id_cargo }}">{{ c.nome }}</option>
        {% endfor %}
      </select>

      <button type="submit">Finalizar Cadastro</button>
    </form>
  </main>

  <script>
    // ---------- TOGGLE DE SENHA ----------
    document.addEventListener('DOMContentLoaded', function () {
      const senhaInput = document.getElementById('senha');
      const toggleBtn = document.getElementById('toggle-senha');

      const eyeSvg = {
        open: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.11 20.11 0 0 1 5.06-6.06"></path><path d="M1 1l22 22"></path></svg>`,
        closed: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>`
      };

      toggleBtn.addEventListener('click', function () {
        const isHidden = senhaInput.type === 'password';
        senhaInput.type = isHidden ? 'text' : 'password';
        toggleBtn.querySelector('svg').outerHTML = isHidden ? eyeSvg.open : eyeSvg.closed;
      });
    });

    // ---------- VALIDAÇÃO DO E-MAIL ----------
    document.getElementById("formCadastro").addEventListener("submit", function(event) {
      const emailInput = document.getElementById("email");
      const erro = document.getElementById("erroEmail");

      const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailValido.test(emailInput.value.trim())) {
        event.preventDefault();
        erro.style.display = "block";
        emailInput.style.borderColor = "red";
      } else {
        erro.style.display = "none";
        emailInput.style.borderColor = "#ccc";
      }
    });
  </script>

</body>
</html>
