<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Serviço - NextDrive</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
</head>

<body>
  <header>
    <img src="{{ url_for('static', filename='img/imglogo.png') }}" alt="Logo" class="logo">
    <h1>Cadastro de Serviço</h1>
    <a href="/homeadm">Home</a>
  </header>

  <main>
    <h2>Novo Serviço</h2>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% if mensagens %}
        {% for categoria, msg in mensagens %}
          <div class="flash {{ categoria }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/cadastroservico" method="POST">

      <h3>Informações do Serviço</h3>

      <label for="tipo_servico">Tipo de Serviço:</label>
      <input type="text" id="tipo_servico" name="tipo_servico">

      <label for="nome">Nome do Serviço:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="preco">Preço (R$):</label>
      <input type="text" id="preco" name="preco" required>

      <label for="id_fornecedor">Fornecedor:</label>
      <select id="id_fornecedor" name="id_fornecedor" required>
        <option value="">Selecione...</option>
        {% for f in fornecedores %}
          <option value="{{ f.id_fornecedor }}">{{ f.razao_social }} ({{ f.cnpj }})</option>
        {% endfor %}
      </select>

      <button type="submit">Cadastrar Serviço</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 NextDrive - Administração</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const precoInput = document.getElementById("preco");

      precoInput.addEventListener("input", function () {
        let v = precoInput.value.replace(/\D/g, "");
        v = (v/100).toFixed(2) + "";
        v = v.replace(".", ",");
        precoInput.value = v;
      });
    });
  </script>

</body>
</html>
