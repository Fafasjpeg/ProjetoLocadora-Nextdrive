<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Veículo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('homeadm') }}">
      <img src="{{ url_for('static', filename='img/imglogo.png') }}" alt="Logo" class="logo">
    </a>
    <h1>NextDrive</h1>
  </header>

  <main>
    <h2>Cadastro de Veículo</h2>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% if mensagens %}
        {% for categoria, msg in mensagens %}
          <div class="flash {{ categoria }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('cadastroveiculo') }}" method="POST" enctype="multipart/form-data">

        <label>Valor Diário:</label>
        <input type="number" step="0.01" name="valor_diario" required>

        <label>Data de Aquisição:</label>
        <input type="date" name="data_aquisicao">

        <label>Marca:</label>
        <input type="text" name="marca" required>

        <label>Modelo:</label>
        <input type="text" name="modelo" required>

        <label>Placa:</label>
        <input type="text" name="placa" maxlength="7" required>

        <label>Cor:</label>
        <input type="text" name="cor" required>

        <label>Quilometragem:</label>
        <input type="number" name="quilometragem" required>

        <label>Categoria:</label>
        <select name="categoria" required>
            <option value="">Selecione</option>
            <option value="Sedan">Sedan</option>
            <option value="Hatch">Hatch</option>
            <option value="SUV">SUV</option>
            <option value="Luxo">Luxo</option>
        </select>

        <label>Foto do Veículo:</label>
        <input type="file" name="foto" accept="image/*">

        <button type="submit">Cadastrar</button>
    </form>
  </main>
</body>
</html>
